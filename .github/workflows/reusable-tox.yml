---
# STARTER STATE. Build this during Phase A of the workshop:
#   - `on: workflow_call:` inputs: python-version, runner-vm-os, toxenv,
#     timeout-minutes, xfail, check-name (all scalar strings, no arrays)
#   - a single job named `tox`
#   - `runs-on`, `timeout-minutes`, `continue-on-error` (xfail-or-prerelease)
#   - `env: TOXENV: ${{ inputs.toxenv }}`
#   - actions/setup-python + actions/checkout steps
#
# Stuck? `git checkout checkpoint/phase-a-skeleton` to see the finished
# version, then come back to `main` and keep building from there.

on:
  workflow_call:
    inputs:
      python-version:
        description: Python version to provision in the VM
        required: true
        type: string

jobs:
  tox:
    runs-on: ubuntu-latest
    steps:
    - name: >-
        Switch to using Python v${{ inputs.python-version }}
        by default
      uses: actions/setup-python@v6
      with:
        python-version: ${{ inputs.python-version }}

    - name: Grab the source from Git
      uses: actions/checkout@v5
